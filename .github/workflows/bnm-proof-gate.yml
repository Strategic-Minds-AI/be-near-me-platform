name: BNM Proof Gate

on:
  pull_request:
    paths:
      - 'src/**'
      - 'visual-lock/BNM-EA-V1/**'
      - 'proof-gate/**'
      - '.github/workflows/bnm-proof-gate.yml'
  workflow_dispatch:

jobs:
  proof-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic proof gate
        run: node proof-gate/proof-gate.mjs
      - name: Upload proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bnm-proof-gate-receipt
          path: proof-gate/receipts/latest.json
