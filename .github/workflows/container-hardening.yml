name: container-hardening

on:
  pull_request:
    paths:
      - "Dockerfile*"
      - "compose.yaml"
      - "docker/**"
      - "ops/super-agent/**"
      - "scripts/validate-container.mjs"
      - "src/**"
      - "package*.json"
      - ".github/workflows/container-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build application
        run: npm run build

      - name: Production dependency audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > audit.json
          audit_exit=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json','utf8'));
          const vulns = Object.entries(audit.vulnerabilities || {});
          const summary = vulns
            .map(([name,v]) => ({name, severity:v.severity, direct:Boolean(v.isDirect), via:Array.isArray(v.via) ? v.via.map(x => typeof x === 'string' ? x : x.title).slice(0,4) : []}))
            .sort((a,b) => ['critical','high','moderate','low'].indexOf(a.severity) - ['critical','high','moderate','low'].indexOf(b.severity));
          console.log(JSON.stringify({metadata:audit.metadata?.vulnerabilities, findings:summary}, null, 2));
          const critical = summary.filter(v => v.severity === 'critical');
          if (critical.length) {
            console.error('Critical production dependency vulnerabilities remain:', critical.map(v=>v.name).join(', '));
            process.exit(1);
          }
          NODE
          echo "npm audit raw exit: $audit_exit (critical gate passed)"

      - name: Build hardened images
        run: |
          docker build -t bnm-web:ci .
          docker build -f Dockerfile.agent -t bnm-super-agent:ci .

      - name: Compose smoke test
        run: |
          AGENT_SOURCE_SHA="$GITHUB_SHA" docker compose up -d --build web super-agent
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 2
          done
          node scripts/validate-container.mjs http://127.0.0.1:8080
          docker compose ps
          docker compose logs --no-color super-agent | tail -100

      - name: Assert no privileged runtime
        run: |
          test "$(docker inspect -f '{{.HostConfig.Privileged}}' bnm-ea-v1-web-1)" = "false"
          test "$(docker inspect -f '{{.HostConfig.Privileged}}' bnm-ea-v1-super-agent-1)" = "false"

      - name: Cleanup
        if: always()
        run: docker compose down -v
