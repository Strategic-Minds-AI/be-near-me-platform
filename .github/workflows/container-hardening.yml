name: container-hardening

on:
  pull_request:
    paths:
      - "Dockerfile*"
      - "compose.yaml"
      - "docker/**"
      - "ops/super-agent/**"
      - "scripts/validate-container.mjs"
      - "src/**"
      - "package*.json"
      - ".github/workflows/container-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.repair.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - id: repair
        name: Apply non-breaking lockfile security repairs
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --omit=dev || true
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: apply non-breaking npm audit lockfile repairs"
          git push origin "HEAD:${{ github.head_ref }}"

  build-and-validate:
    needs: repair-lockfile
    if: always() && (needs.repair-lockfile.result == 'skipped' || needs.repair-lockfile.outputs.changed != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build application
        run: npm run build

      - name: Critical dependency audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Build hardened images
        run: |
          docker build -t bnm-web:ci .
          docker build -f Dockerfile.agent -t bnm-super-agent:ci .

      - name: Compose smoke test
        run: |
          AGENT_SOURCE_SHA="$GITHUB_SHA" docker compose up -d --build web super-agent
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 2
          done
          node scripts/validate-container.mjs http://127.0.0.1:8080
          docker compose ps
          docker compose logs --no-color super-agent | tail -100

      - name: Assert fail-closed Super-Agent behavior
        shell: bash
        run: |
          AGENT_ID=$(docker compose ps -q super-agent)
          test -n "$AGENT_ID"
          docker exec "$AGENT_ID" node -e 'fetch("http://127.0.0.1:8787/healthz").then(async r=>{if(!r.ok)process.exit(1);const b=await r.json();if(!b.ok)process.exit(1)})'
          docker exec "$AGENT_ID" node -e 'fetch("http://127.0.0.1:8787/status").then(async r=>{if(!r.ok)process.exit(1);const b=await r.json();if(!b.lastHeartbeat)process.exit(1)})'

      - name: Assert no privileged runtime
        run: |
          WEB_ID=$(docker compose ps -q web)
          AGENT_ID=$(docker compose ps -q super-agent)
          test "$(docker inspect -f '{{.HostConfig.Privileged}}' "$WEB_ID")" = "false"
          test "$(docker inspect -f '{{.HostConfig.Privileged}}' "$AGENT_ID")" = "false"
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$WEB_ID")" = "true"
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$AGENT_ID")" = "true"

      - name: Cleanup
        if: always()
        run: docker compose down -v
