name: Deterministic Validation

on:
  push:
    branches:
      - "hardening/**"
      - "convergence/**"
  pull_request:
    branches:
      - "baseline/**"
      - main

permissions:
  contents: read

concurrency:
  group: deterministic-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      VALIDATION_PHASE: hardening
      FROZEN_BASELINE_SHA: c7d3f11e828f0ff0983406e32079a17598eabed0

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint changed application files
        shell: bash
        run: |
          set -euo pipefail
          CHANGED_FILES="$(git diff --name-only "$FROZEN_BASELINE_SHA"...HEAD | grep -E '^src/.*\.(js|jsx)$' || true)"
          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed JS/JSX application files."
          else
            printf '%s\n' "$CHANGED_FILES"
            npx eslint $CHANGED_FILES
          fi

      - name: Typecheck frozen application surface
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Deterministic governance and product-integrity checks
        run: node scripts/deterministic-validator.mjs

      - name: Critical production dependency audit
        run: npm audit --omit=dev --audit-level=critical
